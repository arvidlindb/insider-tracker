name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera beroenden
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Tester
        run: pytest -v
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-key"  # fejknyckel, tester får aldrig anropa riktiga API:t
          DATABASE_URL: "sqlite:///./test.db"
