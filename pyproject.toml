[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insider-tracker"
version = "0.1.0"
description = "Bevakning av insynsaffärer från Finansinspektionen med AI-sammanfattningar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.50",
    "altair>=5.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insider_tracker"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
